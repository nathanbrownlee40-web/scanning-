<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101010">
  <title>Value Bet Scanner</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header>
      <div>
        <div class="eyebrow">API-FOOTBALL • STATIC SCANNER</div>
        <h1>Value Bet Scanner</h1>
        <p>Direct browser scanner — API key is managed by Netlify.</p>
      </div>
      <div class="status" id="status">Checking API key…</div>
    </header>

    <section class="panel controls">
      <h2>Scanner</h2>

      <div class="grid">
        <label>Date<input id="date" type="date"></label>
        <label>Max fixtures<input id="maxFixtures" type="number" min="1" max="300" value="50"></label>
        <label>Min probability %<input id="minProb" type="number" min="0" max="100" value="60"></label>
        <label>Min EV %<input id="minEV" type="number" min="-100" max="500" value="5"></label>
        <label>History matches<input id="history" type="number" min="5" max="20" value="10"></label>
      </div>

      <div class="markets">
        <label><input type="checkbox" value="goals" checked> Goals</label>
        <label><input type="checkbox" value="btts" checked> BTTS</label>
        <label><input type="checkbox" value="corners" checked> Match corners</label>
        <label><input type="checkbox" value="shots" checked> Match shots</label>
        <label><input type="checkbox" value="sot" checked> Match shots on target</label>
        <label><input type="checkbox" value="cards" checked> Match cards</label>
      </div>

      <div class="actions">
        <button id="scan">Scan fixtures</button>
        <button class="secondary" id="stop">Stop</button>
        <button class="secondary" id="export">Export CSV</button>
      </div>

      <div id="progress" class="progress"></div>
      <p class="note">Probabilities are historical hit rates with Laplace smoothing, not guaranteed outcomes. EV is calculated from the displayed odds.</p>
    </section>

    <section class="panel summary">
      <div><strong id="fixtureCount">0</strong><span>fixtures</span></div>
      <div><strong id="betCount">0</strong><span>value bets</span></div>
      <div><strong id="avgEV">0%</strong><span>avg EV</span></div>
    </section>

    <section id="results" class="results"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
